name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    uses: CitrateNetwork/.github/.github/workflows/reusable-js-ci.yml@main

  # FWA-C12-01 + FWA-BV-SDK-01 supply-chain tripwire: publish-name drift +
  # publishConfig (access + registry) gate. Fails the build if:
  #   - package.json#name drifts from the reserved set in PUBLISH_NAMES.json
  #     (the in-repo mirror of the federation manifest [repos.citrate-sdk-js]),
  #   - publishConfig.access is dropped, or
  #   - publishConfig.registry is repointed away from the canonical registry
  #     host recorded in PUBLISH_NAMES.json#registry (registry-drift exfil).
  #
  # FWA-BV-SDK-02: this job is the AUTHORITATIVE enforcement of the gate. The
  # `prepublishOnly` npm hook is client-side and is silently skipped by
  # `npm publish --ignore-scripts`; this CI job runs the gate independently of
  # any npm lifecycle hook (it invokes the script directly, not via `npm
  # publish`) and is a hard `needs:` precondition for the release/publish job
  # in release.yml. It is therefore not bypassable by `--ignore-scripts`.
  publish-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish-name + registry drift gate (FWA-C12-01 / BV-SDK-01)
        run: node scripts/check-publish-names.mjs

  # CL-C2 / SW-089: fail the build if the vendored federation-contract artifact
  # drifts from the canonical federation intermediate. Federation's own
  # contract-artifact-drift gate keeps that intermediate fresh vs citrate-chain,
  # so this SDK-side gate only has to prove the vendored copy matches it.
  # Requires a read-only token for CitrateNetwork/citrate-federation; inert until
  # GitHub Actions + CITRATE_FEDERATION_READ_TOKEN are available (the local
  # mirror scripts/check-contract-drift.sh runs the identical check meanwhile).
  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: citrate-sdk-js
      - name: Checkout canonical citrate-federation intermediate (sparse)
        uses: actions/checkout@v4
        with:
          repository: CitrateNetwork/citrate-federation
          ref: main
          token: ${{ secrets.CITRATE_FEDERATION_READ_TOKEN }}
          path: citrate-federation
          sparse-checkout: |
            contract
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Contract-artifact drift gate (blocking)
        run: cd citrate-sdk-js && npm run verify:contract
