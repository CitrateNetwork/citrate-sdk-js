name: Release

# FWA-BV-SDK-02 — authoritative, server-side enforcement of the supply-chain
# publish gate. The publish job CANNOT run until the `publish-names-gate` job
# (which runs scripts/check-publish-names.mjs directly, NOT through an npm
# lifecycle hook) has passed. This closes the `npm publish --ignore-scripts`
# bypass: `--ignore-scripts` disables the client-side `prepublishOnly` hook,
# but it has no power over a CI job that is a hard `needs:` precondition.
#
# Publishing uses npm TRUSTED PUBLISHING (OIDC): no npm token is stored in
# GitHub. Each package has a Trusted Publisher on npmjs.com bound to
# CitrateNetwork/citrate-sdk-js + this file (release.yml). npm issues a
# short-lived credential for this workflow run only and records signed
# provenance for the tarball (2026-09-24 pre-bounty audit, PBA-L6-004).
#
# Triggered on a version tag push (or manual dispatch).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Hard gate. Runs the drift check independently of npm's lifecycle hooks so
  # it is immune to `npm publish --ignore-scripts`.
  publish-names-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Publish-name + registry drift gate (FWA-C12-01 / BV-SDK-01)
        run: node scripts/check-publish-names.mjs

  publish:
    # Blocked until the gate job succeeds. If the gate fails (name drift,
    # dropped publishConfig, repointed registry, or provenance drift) this job
    # is skipped and nothing is ever published.
    needs: publish-names-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC: npm trusted publishing + provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # No registry-url here: that makes setup-node write an _authToken
      # placeholder into .npmrc. The repo .npmrc already pins the registry, and
      # trusted publishing authenticates through OIDC, not a token.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: npm new enough for trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@11.6.2
          npm --version
      # Belt-and-suspenders: re-run the gate in the publish job itself, again
      # independently of npm lifecycle hooks, so the precondition holds even if
      # the job graph is edited later.
      - name: Re-assert publish-name + registry gate
        run: node scripts/check-publish-names.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build publish artifact
        run: npm run build:publish
      # PBA-L4-001: refuse to publish a tarball whose deployModel calldata can
      # rebuild the model key. Runs against the packed artifact, not src/.
      - name: Key-share leak tripwire (packed artifact)
        run: node scripts/check-keyshare-pack.mjs
      - name: Publish @citratelabs/sdk (trusted publishing + provenance)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER already published; skipping."
          else
            npm publish --access public --provenance --loglevel verbose
          fi
      # The deprecated compatibility shim re-exports @citratelabs/sdk. Skips
      # cleanly if its version is already on the registry, so it only goes out
      # when compat/citrate-js/package.json bumps. --provenance is explicit:
      # this subdirectory does not read the repo-root .npmrc.
      - name: Publish deprecated shim (@citratelabs/citrate-js)
        working-directory: compat/citrate-js
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER already published; skipping."
          else
            npm publish --access public --provenance --loglevel verbose
          fi
